name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The app targets macOS 14.2+ on Apple Silicon only; there is no Linux or Windows target.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          cmake --version
      - name: Checks
        run: sh scripts/test.sh
      - name: Release build
        run: python3 scripts/build.py --jobs 3
